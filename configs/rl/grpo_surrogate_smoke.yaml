# One-complex GRPO surrogate smoke config.
#
# Smoke-only path: this consumes an existing 4-sample DiffDock rollout run,
# computes RMSD rewards and group-relative advantages, then performs one
# GRPO-style update on a small debug-linear surrogate scorer:
#
#   ratio = exp(surrogate_score - old_surrogate_score)
#   loss = -mean(min(ratio * advantage, clipped_ratio * advantage))
#
# It proves the GRPO objective shape, signs, metrics, and checkpoint artifacts.
# Real Option2 training should instead generate fresh grouped rollouts on the
# fly from theta_old at each update and then update the DiffDock sampling model.

experiment:
  name: diffdock_grpo_smoke
  model: diffdock
  mode: posttraining_grpo_surrogate_smoke
  seed: 42

algorithm:
  name: grpo_surrogate
  policy_mode: surrogate
  surrogate_backend: debug_linear
  grpo_epochs: 1
  minibatch_size: 4
  learning_rate: 0.05
  clip_epsilon: 0.2
  max_score_delta: 20.0

data:
  # Override from the CLI:
  #   --source-run-dir artifacts/runs/<one_complex_top4_run_id>
  source_run_dir: null

reward:
  type: composite
  weights:
    rmsd: 1.0
    confidence: 0.0
  sigma_angstrom: 2.0
  max_rmsd: 10.0
  invalid_reward: -1.0
  confidence_mode: logit
  confidence_temperature: 1.0

rollout:
  samples_per_complex: 4
  advantage_normalization: zscore
  min_valid_samples_per_complex: 2
  invalid_group_action: zero

artifacts:
  run_root: artifacts/runs
  run_tag: null
