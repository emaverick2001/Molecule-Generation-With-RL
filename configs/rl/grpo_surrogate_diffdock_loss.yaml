# GRPO surrogate run using the DiffDock-loss backend seam.
#
# This is the next step after the debug-linear GRPO smoke test. It validates
# that grouped rollouts, RMSD rewards, advantages, DiffDock-loss-style scoring,
# logs, score tables, and checkpoints all work through the same posttraining
# entrypoint.
#
# Current implementation note:
# - The backend uses a lightweight DiffDock-loss proxy derived from the RMSD
#   reward path.
# - It does NOT update DiffDock model weights yet.
# - The production hook is:
#       s_theta = -DiffDock_loss_theta(pose, complex)
#   where the proxy should be replaced by an in-process per-pose DiffDock loss.

experiment:
  name: diffdock_rl
  model: diffdock
  mode: posttraining_grpo_surrogate_diffdock_loss
  seed: 42

algorithm:
  name: grpo_surrogate
  policy_mode: surrogate
  surrogate_backend: diffdock_loss
  grpo_epochs: 1
  minibatch_size: 4
  learning_rate: 0.05

data:
  # Override this from the CLI:
  #   --source-run-dir imported_runs/rl_smoke_1bn1_040030
  source_run_dir: null

reward:
  type: composite
  weights:
    rmsd: 1.0
    confidence: 0.0
  sigma_angstrom: 2.0
  max_rmsd: 10.0
  invalid_reward: -1.0
  confidence_mode: logit
  confidence_temperature: 1.0

rollout:
  samples_per_complex: 4
  advantage_normalization: zscore
  min_valid_samples_per_complex: 2
  invalid_group_action: zero

artifacts:
  run_root: artifacts/runs
  run_tag: null
